<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo - PLANET GAMES</title>
    <!-- Importação do Bootstrap para alinhar as colunas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #0b0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header-title {
            text-align: center;
            margin: 30px 0 10px 0;
            font-size: 32px;
            font-weight: bold;
        }
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .search-box input {
            width: 80%;
            max-width: 450px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #1a2a22;
            background-color: #121a15;
            color: #fff;
            outline: none;
            text-align: center;
        }
        .card-game {
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-game:hover {
            transform: translateY(-5px);
            border: 1px solid #00ff66 !important;
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <h1 class="header-title">Catálogo de Jogos Xbox 360</h1>

    <!-- Campo de Pesquisa em Tempo Real -->
    <div class="search-box">
        <input type="text" id="inputBusca" onkeyup="filtrarJogos()" placeholder="Pesquise seu jogo...">
    </div>

    <!-- Grade dos Cards de Jogos -->
    <div class="container my-4">
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
            {% for jogo in jogos %}
            <div class="col card-item">
                <div class="card h-100 bg-dark text-white border-0 shadow-sm card-game" style="border-radius: 8px; overflow: hidden; background-color: #12171a !important;">
                    <img src="{{ jogo.capa }}" 
                         class="card-img-top" 
                         alt="{{ jogo.nome }}"
                         style="aspect-ratio: 3/4; object-fit: cover; background-color: #000;"
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/200x270/12171a/ffffff?text=Sem+Capa';">
                    <div class="card-body p-2 text-start" style="background-color: #1c2326;">
                        <div class="fw-bold text-truncate text-white card-title" style="font-size: 0.85rem;" title="{{ jogo.nome }}">{{ jogo.nome }}</div>
                        <small class="text-muted font-monospace d-block" style="font-size: 0.75rem;">{{ jogo.id }}</small>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Script de Filtro Instantâneo -->
    <script>
        function filtrarJogos() {
            let input = document.getElementById('inputBusca').value.toLowerCase();
            let itens = document.getElementsByClassName('card-item');

            for (let i = 0; i < itens.length; i++) {
                let title = itens[i].querySelector('.card-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    itens[i].style.display = "";
                } else {
                    itens[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
