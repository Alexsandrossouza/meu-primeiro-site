<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Ícone da aba do navegador (Favicon) -->
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='favicon.png.jpeg') }}?v=3">

    <!-- GOOGLE ANALYTICS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW3JKVWY80"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SW3JKVWY80');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo - PLANET GAMES</title>
    
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
    <!-- Importação do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0b0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header-title {
            text-align: center;
            margin: 20px 0;
            font-size: 32px;
            font-weight: bold;
        }
        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .search-box input {
            width: 80%;
            max-width: 450px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #1a2a22;
            background-color: #121a15;
            color: #fff;
            outline: none;
            text-align: center;
        }
        .card-game {
            background-color: #12171a !important;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1e282c;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-game:hover {
            transform: translateY(-5px);
            border-color: #00ff66 !important;
        }
        .card-img-top {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: #000;
        }
        .card-body-custom {
            padding: 10px;
            background-color: #1c2326;
        }
        .card-title-custom {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-id-custom {
            font-size: 0.75rem;
            color: #7f8c8d;
            font-family: monospace;
            display: block;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO -->
    <header class="navbar mb-4">
        <a href="/" style="text-decoration: none; color: inherit;">
            <div class="logo">
                <span class="icon">🎮</span> PLANET <span class="green-text">GAMES</span>
            </div>
        </a>

        <nav>
          <a href="/">Início</a>
          <a href="/produtos">Produto</a>
          <a href="/xboxclassico">Xbox Clássico</a>
          <a href="/catalogo-completo">Catálogo x360db</a>
          <a href="/chat">Bate-Papo</a>
          <a href="/admin">Painel Admin</a>
       </nav>
    </header>

    <h1 class="header-title">Catálogo de Jogos Xbox 360</h1>

    <div class="search-box">
        <input type="text" id="inputBusca" onkeyup="filtrarJogos()" placeholder="Pesquise seu jogo por nome ou ID...">
    </div>

    <div class="container-fluid">
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="listaJogos">
            {% for jogo in jogos %}
            <!-- Exibe apenas os primeiros 40 de início para ficar ultra rápido -->
            <div class="col card-item {% if loop.index > 40 %}d-none{% endif %}">
                <div class="card h-100 card-game border-0 shadow-sm">
                    <img src="{{ jogo.capa }}" 
                         class="card-img-top" 
                         alt="{{ jogo.nome }}"
                         loading="lazy"
                         onerror="tratarErroImagem(this, '{{ jogo.id }}')">
                    <div class="card-body-custom">
                        <div class="card-title-custom" title="{{ jogo.nome }}">{{ jogo.nome }}</div>
                        <span class="card-id-custom">{{ jogo.id }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center my-4" id="btnContainer">
            <button id="btnCarregarMais" onclick="carregarMais()" class="btn btn-outline-success">Carregar Mais Jogos</button>
        </div>
    </div>

    <script>
        let limiteExibicao = 40;

        // Procura na subpasta artwork/ e extensões alternadas se falhar
        function tratarErroImagem(img, id) {
            if (!img.dataset.tentativa) {
                img.dataset.tentativa = "1";
                img.src = "/static/x360db-main/titles/" + id + "/artwork/boxart.jpg";
            } else if (img.dataset.tentativa === "1") {
                img.dataset.tentativa = "2";
                img.src = "/static/x360db-main/titles/" + id + "/artwork/boxart.png";
            } else if (img.dataset.tentativa === "2") {
                img.dataset.tentativa = "3";
                img.src = "/static/x360db-main/titles/" + id + "/boxart.jpg";
            } else {
                img.onerror = null;
                img.src = "https://via.placeholder.com/200x240/12171a/ffffff?text=Sem+Capa";
            }
        }

        // Pesquisa em TODOS os milhares de jogos
        function filtrarJogos() {
            let input = document.getElementById('inputBusca').value.toLowerCase().trim();
            let itens = document.getElementsByClassName('card-item');
            let btn = document.getElementById('btnCarregarMais');

            if (input !== "") {
                btn.style.display = "none";
                for (let i = 0; i < itens.length; i++) {
                    let title = itens[i].querySelector('.card-title-custom').innerText.toLowerCase();
                    let id = itens[i].querySelector('.card-id-custom').innerText.toLowerCase();

                    if (title.includes(input) || id.includes(input)) {
                        itens[i].classList.remove('d-none');
                    } else {
                        itens[i].classList.add('d-none');
                    }
                }
            } else {
                btn.style.display = "inline-block";
                resetarExibicao();
            }
        }

        function carregarMais() {
            limiteExibicao += 40;
            resetarExibicao();
        }

        function resetarExibicao() {
            let itens = document.getElementsByClassName('card-item');
            for (let i = 0; i < itens.length; i++) {
                if (i < limiteExibicao) {
                    itens[i].classList.remove('d-none');
                } else {
                    itens[i].classList.add('d-none');
                }
            }
        }
    </script>

</body>
</html>
