<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo - PLANET GAMES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Estilos adicionais para manter o mesmo padrão da imagem */
        body {
            background-color: #0b0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header-title {
            text-align: center;
            margin: 30px 0 10px 0;
            font-size: 32px;
            font-weight: bold;
        }
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .search-box input {
            width: 80%;
            max-width: 450px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #1a2a22;
            background-color: #121a15;
            color: #fff;
            outline: none;
            text-align: center;
        }
        .grid-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 0 40px 40px 40px;
        }
        .card-game {
            background: #12171a;
            border-radius: 12px;
            border: 1px solid #1e282c;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-game:hover {
            transform: translateY(-5px);
            border-color: #00ff66;
        }
        .card-game img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }
        .card-info {
            padding: 12px;
            text-align: left;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge-green {
            background: rgba(0, 255, 102, 0.1);
            color: #00ff66;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            display: inline-block;
            margin-bottom: 10px;
        }
        .btn-download {
            display: block;
            background: #00ff66;
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background: #00cc52;
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <h1 class="header-title">Catálogo de Jogos Xbox 360</h1>

    <!-- Campo de Pesquisa em Tempo Real -->
    <div class="search-box">
        <input type="text" id="inputBusca" onkeyup="filtrarJogos()" placeholder="Pesquise seu jogo...">
    </div>

    <!-- Grade dos Cards de Jogos (Modelado no seu design) -->
    <div class="grid-jogos" id="gridJogos">
        {% for jogo in jogos %}
        <div class="card-game">
            <img src="{{ jogo.capa }}" alt="{{ jogo.nome }}" onerror="this.src='https://via.placeholder.com/200x270/12171a/00ff66?text=Sem+Capa'">
            <div class="card-info">
                <div class="card-title">{{ jogo.nome }}</div>
                <span class="badge-green">{{ jogo.plataforma }} - {{ jogo.formato }}</span>
                <a href="https://github.com/Alexsandrossouza/x360db/tree/main/titles/{{ jogo.id }}" target="_blank" class="btn-download">Ver no x360db</a>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Script de Filtro Instantâneo -->
    <script>
        function filtrarJogos() {
            let input = document.getElementById('inputBusca').value.toLowerCase();
            let cards = document.getElementsByClassName('card-game');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].querySelector('.card-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
